# pg_hba.conf للقاعدة الأساسية (laravel-db) — يسمح لنسخة القراءة بالتكرار (replication)
# TYPE  DATABASE     USER  ADDRESS        METHOD
local   all          all                  trust
host    all          all   127.0.0.1/32   trust
host    all          all   ::1/128        trust
local   replication  all                  trust
host    replication  all   127.0.0.1/32   trust
host    replication  all   ::1/128        trust
# تكرار الـ WAL من حاوية النسخة (في بيئة الإنتاج: مستخدم مخصّص بصلاحية REPLICATION فقط)
host    replication  shop  all            scram-sha-256
host    all          all   all            scram-sha-256
