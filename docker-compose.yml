services:
  # قاعدة بيانات Laravel
  laravel-db:
    image: postgres:16-alpine
    container_name: laravel-db
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - laravel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    # تهيئة Laravel مرة واحدة قبل تشغيل النسخ
  laravel-init:
    build: ./laravel-app
    environment:
      APP_ENV: local
      APP_KEY: base64:YvHTIIzZ2JCMi1dV4+ROpQQQmhR+qPSpXQIctXP52jM=
      APP_INIT: "true"

      DB_CONNECTION: pgsql
      DB_HOST: laravel-db
      DB_PORT: 5432
      DB_DATABASE: shop
      DB_USERNAME: shop
      DB_PASSWORD: shop

    depends_on:
      laravel-db:
        condition: service_healthy

    volumes:
      - ./laravel-app:/var/www/html
      - uploads:/var/www/html/storage/app/public

    restart: "no"
    command: ["php", "artisan", "--version"]
  # قاعدة بيانات خدمة المستودع
  inventory-db:
    image: postgres:16-alpine
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  # خدمة المستودع (Spring Boot + gRPC)
  inventory:
    build: ./inventory-service
    container_name: inventory
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
      GRPC_SERVER_PORT: 9090
    depends_on:
      inventory-db:
        condition: service_healthy
    ports:
      - "9090:9090"

  # التطبيق الأساسي (Laravel) -> يُوزّع عبر Nginx على http://127.0.0.1:8088
  laravel:
    build: ./laravel-app
    deploy:
      replicas: 3
    environment:
      APP_INIT: "false"
      APP_ENV: local
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: base64:YvHTIIzZ2JCMi1dV4+ROpQQQmhR+qPSpXQIctXP52jM=
      DB_CONNECTION: pgsql
      DB_HOST: laravel-db
      DB_PORT: 5432
      DB_DATABASE: shop
      DB_USERNAME: shop
      DB_PASSWORD: shop
      INVENTORY_GRPC_HOST: inventory
      INVENTORY_GRPC_PORT: 9090
      INVENTORY_GRPC_TIMEOUT: 3
      PHP_CLI_SERVER_WORKERS: "4"
      QUEUE_CONNECTION: rabbitmq

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: shop
      RABBITMQ_PASSWORD: shop
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: emails

      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME}"

      BROADCAST_CONNECTION: pusher
      PUSHER_APP_ID: ecommerce
      PUSHER_APP_KEY: ecommerce-key
      PUSHER_APP_SECRET: ecommerce-secret
      PUSHER_HOST: soketi
      PUSHER_PORT: 6001
      PUSHER_SCHEME: http
      PUSHER_APP_CLUSTER: mt1

      LOG_CHANNEL: stack
      LOG_STACK: stderr

    depends_on:
      laravel-init:
        condition: service_completed_successfully
      laravel-db:
        condition: service_healthy
      inventory:
        condition: service_started
    expose:
      - "8000"
    volumes:
      - ./laravel-app:/var/www/html
      - uploads:/var/www/html/storage/app/public
    restart: unless-stopped

  # موزّع الأحمال (Nginx)
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./laravel-app
    deploy:
      replicas: 3
    command: ["php", "artisan", "queue:work", "rabbitmq", "--queue=emails,broadcasts", "--sleep=1", "--tries=3", "--timeout=50"]
    environment:
      APP_INIT: "false"
      APP_ENV: local
      APP_KEY: base64:YvHTIIzZ2JCMi1dV4+ROpQQQmhR+qPSpXQIctXP52jM=
      DB_CONNECTION: pgsql
      DB_HOST: laravel-db
      DB_PORT: 5432
      DB_DATABASE: shop
      DB_USERNAME: shop
      DB_PASSWORD: shop
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: shop
      RABBITMQ_PASSWORD: shop
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: emails
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME}"
      BROADCAST_CONNECTION: pusher
      PUSHER_APP_ID: ecommerce
      PUSHER_APP_KEY: ecommerce-key
      PUSHER_APP_SECRET: ecommerce-secret
      PUSHER_HOST: soketi
      PUSHER_PORT: 6001
      PUSHER_SCHEME: http
      PUSHER_APP_CLUSTER: mt1
      LOG_CHANNEL: stack
      LOG_STACK: stderr
    depends_on:
      laravel-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      laravel-db:
        condition: service_healthy
    volumes:
      - ./laravel-app:/var/www/html
    restart: unless-stopped

  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: soketi
    environment:
      SOKETI_DEFAULT_APP_ID: ecommerce
      SOKETI_DEFAULT_APP_KEY: ecommerce-key
      SOKETI_DEFAULT_APP_SECRET: ecommerce-secret
      SOKETI_PORT: 6001
    ports:
      - "6001:6001"
      - "9601:9601"
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: adminer
    ports:
      - "8089:8080"
    depends_on:
      - laravel-db

volumes:
  laravel-db-data:
  inventory-db-data:
  uploads:
  rabbitmq-data: