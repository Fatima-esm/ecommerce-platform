services:
  # قاعدة بيانات Laravel
  laravel-db:
    image: postgres:16-alpine
    container_name: laravel-db
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - laravel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  # قاعدة بيانات خدمة المستودع
  inventory-db:
    image: postgres:16-alpine
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  # خدمة المستودع (Spring Boot + gRPC)
  inventory:
    build: ./inventory-service
    container_name: inventory
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
      GRPC_SERVER_PORT: 9090
    depends_on:
      inventory-db:
        condition: service_healthy
    ports:
      - "9090:9090"

  # التطبيق الأساسي (Laravel) -> http://127.0.0.1:8088
  laravel:
    build: ./laravel-app
    container_name: laravel
    environment:
      APP_ENV: local
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: base64:YvHTIIzZ2JCMi1dV4+ROpQQQmhR+qPSpXQIctXP52jM=
      DB_CONNECTION: pgsql
      DB_HOST: laravel-db
      DB_PORT: 5432
      DB_DATABASE: shop
      DB_USERNAME: shop
      DB_PASSWORD: shop
      INVENTORY_GRPC_HOST: inventory
      INVENTORY_GRPC_PORT: 9090
      INVENTORY_GRPC_TIMEOUT: 3
      PHP_CLI_SERVER_WORKERS: "4"
    depends_on:
      laravel-db:
        condition: service_healthy
      inventory:
        condition: service_started
    ports:
      - "8088:8000"
    volumes:
      - ./laravel-app:/var/www/html
      - uploads:/var/www/html/storage/app/public

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./laravel-app
    container_name: queue-worker
    entrypoint: ["php", "artisan", "queue:work", "rabbitmq", "--queue=emails,broadcasts", "--sleep=1", "--tries=3", "--timeout=50"]
    environment:
      APP_ENV: local
      APP_KEY: base64:YvHTIIzZ2JCMi1dV4+ROpQQQmhR+qPSpXQIctXP52jM=
      DB_CONNECTION: pgsql
      DB_HOST: laravel-db
      DB_PORT: 5432
      DB_DATABASE: shop
      DB_USERNAME: shop
      DB_PASSWORD: shop
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: shop
      RABBITMQ_PASSWORD: shop
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: emails
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: solaimanesmaeel334@gmail.com
      MAIL_PASSWORD: unlrpsubwjbrqjee
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: shop@gmail.com
      MAIL_FROM_NAME: ShopApp
    depends_on:
      rabbitmq:
        condition: service_healthy
      laravel-db:
        condition: service_healthy
    volumes:
      - ./laravel-app:/var/www/html
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: adminer
    ports:
      - "8089:8080"
    depends_on:
      - laravel-db

volumes:
  laravel-db-data:
  inventory-db-data:
  uploads:
  rabbitmq-data:
