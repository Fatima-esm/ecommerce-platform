syntax = "proto3";

package inventory;

option java_multiple_files = true;
option java_package = "com.ecommerce.inventory.grpc";
option java_outer_classname = "InventoryProto";

service InventoryService {
  // 1. Get stock quantity for a specific product
  rpc GetStock (GetStockRequest) returns (GetStockReply);

  // 2. Reserve quantities for multiple products in an order (all or nothing)
  rpc Reserve  (ReserveRequest)  returns (ReserveReply);

  // 3. Release reserved quantities if order creation fails
  rpc Release  (ReleaseRequest)  returns (ReleaseReply);

  // 4. Set initial stock quantity (when adding a new product)
  rpc SetStock (SetStockRequest) returns (SetStockReply);
}

message StockItem {
  int64 product_id = 1;   // Product ID
  int32 quantity   = 2;   // Requested quantity  
}

// GetStock 
message GetStockRequest {
  int64 product_id = 1;
}

message GetStockReply {
  bool  found     = 1;    // Is the product found in the warehouse?
  int32 available = 2;    // Current available quantity
}

// Reserve 
message ReserveRequest {
  string order_ref = 1;           // Order reference (e.g., UUID) to make the operation idempotent
  repeated StockItem items = 2;   // List of products and quantities to reserve
}

message FailedItem {
  int64  product_id = 1;
  int32  requested  = 2;
  int32  available  = 3;
  string reason     = 4;          // INSUFFICIENT_STOCK | UNKNOWN_PRODUCT
}

message ReserveReply {
  bool   success            = 1;
  string message            = 2;
  repeated FailedItem failed_items = 3;  // Empty if reservation succeeds
}

// Release 
message ReleaseRequest {
  string order_ref = 1;   // The same reference used in Reserve
}

message ReleaseReply {
  bool   success = 1;
  string message = 2;
}

// SetStock 
message SetStockRequest {
  int64 product_id = 1;
  int32 quantity   = 2;
}

message SetStockReply {
  bool success = 1;
}