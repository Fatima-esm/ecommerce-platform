
<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>طلباتي | ShopApp</title>

    <link rel="stylesheet" href="../assets/style.css">
</head>

<body>

    <!-- =====================================
         الشريط العلوي
    ====================================== -->

    <header class="topbar">

        <a class="brand" href="products.html">
            ShopApp
        </a>

        <nav>
            <a href="products.html">المنتجات</a>

            <a href="checkout.html">🛒 سلة المشتريات</a>

            <button
                class="btn secondary"
                id="logoutBtn"
                type="button"
            >
                تسجيل الخروج
            </button>
        </nav>

    </header>


    <!-- =====================================
         محتوى الصفحة
    ====================================== -->

    <main class="container">

        <div class="section-head">

            <div>
                <h1>طلباتي</h1>

                <p>
                    يمكنك متابعة طلباتك ومعرفة حالتها وتفاصيل المنتجات.
                </p>
            </div>

            <button
                id="refreshBtn"
                class="btn secondary"
                type="button"
            >
                ↻ تحديث الطلبات
            </button>

        </div>


        <!-- رسائل النجاح والأخطاء -->

        <div
            id="notice"
            class="notice hidden"
            role="status"
            aria-live="polite"
        ></div>


        <!-- مؤشر الاتصال -->

        <div class="statusbar">

            <span
                id="realtimeDot"
                class="dot"
            ></span>

            <span id="realtimeText">
                جاري الاتصال بالتحديثات المباشرة...
            </span>

        </div>


        <!-- إحصائيات الطلبات -->

        <section class="grid" id="orderStats">

            <div class="panel">
                <p>إجمالي الطلبات</p>
                <h2 id="totalOrders">0</h2>
            </div>

            <div class="panel">
                <p>طلبات قيد الانتظار</p>
                <h2 id="pendingOrders">0</h2>
            </div>

            <div class="panel">
                <p>طلبات مؤكدة</p>
                <h2 id="confirmedOrders">0</h2>
            </div>

            <div class="panel">
                <p>طلبات ملغاة</p>
                <h2 id="cancelledOrders">0</h2>
            </div>

        </section>


        <!-- قائمة الطلبات -->

        <section id="orders">

            <div class="panel empty-state">
                جاري تحميل طلباتك...
            </div>

        </section>

    </main>


    <!-- =====================================
         ملفات JavaScript
    ====================================== -->


    <!-- مكتبة Pusher المطلوبة للاتصال بـ Soketi -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>

    <!-- إعدادات المشروع -->
    <script src="../assets/config.js"></script>

    <!-- دوال API وإدارة التوكن -->
    <script src="../assets/api.js"></script>

    <!-- الاتصال بـ Soketi والاشتراك في القنوات -->
    <script src="../assets/realtime.js"></script>


    <script>

        // =====================================
        // 1. عناصر الصفحة والمتغيرات
        // =====================================

        const ordersContainer =
            document.getElementById('orders');

        const notice =
            document.getElementById('notice');

        const refreshButton =
            document.getElementById('refreshBtn');

        const realtimeDot =
            document.getElementById('realtimeDot');

        const realtimeText =
            document.getElementById('realtimeText');

        let ordersArray = [];

        let realtimeInitialized = false;


        // =====================================
        // 2. التحقق من تسجيل الدخول
        // =====================================

        if (requireLogin()) {

            document
                .getElementById('logoutBtn')
                .addEventListener('click', logout);

            refreshButton.addEventListener(
                'click',
                loadMyOrders
            );

            loadMyOrders();

        }


        // =====================================
        // 3. جلب طلبات العميل من Laravel
        // =====================================

        async function loadMyOrders() {

            ordersContainer.innerHTML = `
                <div class="panel empty-state">
                    جاري تحميل طلباتك...
                </div>
            `;

            refreshButton.disabled = true;

            try {

                const response = await api('/api/v1/orders');

                ordersArray = extractRows(response);

                renderOrders();

                renderStatistics();

                // تهيئة الاتصال المباشر مرة واحدة
                if (!realtimeInitialized) {

                    initializeRealtime();

                    realtimeInitialized = true;

                }

            } catch (error) {

                ordersContainer.innerHTML = '';

                msg(
                    notice,
                    'تعذر تحميل الطلبات: ' + error.message,
                    true
                );

            } finally {

                refreshButton.disabled = false;

            }

        }


        // =====================================
        // 4. عرض جميع الطلبات
        // =====================================

        function renderOrders() {

            if (!ordersArray.length) {

                ordersContainer.innerHTML = `
                    <div class="panel empty-state">

                        <h2>لا توجد طلبات حتى الآن</h2>

                        <p>
                            لم تقم بإنشاء أي طلب بعد.
                        </p>

                        <a
                            href="products.html"
                            class="btn"
                        >
                            تصفح المنتجات
                        </a>

                    </div>
                `;

                return;

            }

            // ترتيب الطلبات من الأحدث إلى الأقدم
            const sortedOrders = [...ordersArray].sort(
                (a, b) => Number(b.id) - Number(a.id)
            );

            ordersContainer.innerHTML = sortedOrders.map(
                order => renderOrder(order)
            ).join('');

        }


        // =====================================
        // 5. إنشاء بطاقة طلب
        // =====================================

        function renderOrder(order) {

            const orderId = Number(order.id);

            const items = Array.isArray(order.items)
                ? order.items
                : [];

            const status = order.status || 'pending';

            const createdAt = formatDate(
                order.created_at
            );

            const itemsHTML = items.length

                ? items.map(item => {

                    const productName =
                        item.product?.name ||
                        item.product_name ||
                        'منتج #' + item.product_id;

                    const quantity =
                        Number(item.quantity || 0);

                    const price =
                        Number(
                            item.price ??
                            item.unit_price ??
                            item.product?.price ??
                            0
                        );

                    return `
                        <div class="order-item">

                            <div class="order-item-info">

                                <b>
                                    ${esc(productName)}
                                </b>

                                <span>
                                    الكمية: ${quantity}
                                </span>

                            </div>

                            <div class="order-item-price">

                                ${money(price * quantity)}

                            </div>

                        </div>
                    `;

                }).join('')

                : `
                    <p class="text-muted">
                        لا تتوفر تفاصيل المنتجات لهذا الطلب.
                    </p>
                `;


            return `

                <article
                    class="panel order-card"
                    data-order-id="${orderId}"
                >

                    <!-- رأس الطلب -->

                    <div class="order-header">

                        <div>

                            <h2>
                                الطلب #${orderId}
                            </h2>

                            <p class="text-muted">
                                تاريخ الطلب: ${esc(createdAt)}
                            </p>

                        </div>

                        <div
                            class="order-status"
                            data-order-status
                        >
                            ${renderStatus(status)}
                        </div>

                    </div>


                    <!-- تفاصيل المنتجات -->

                    <div class="order-products">

                        <h3>
                            المنتجات
                        </h3>

                        ${itemsHTML}

                    </div>


                    <!-- إجمالي الطلب -->

                    <div class="order-footer">

                        <span>
                            إجمالي الطلب
                        </span>

                        <strong>
                            ${money(order.total_amount)}
                        </strong>

                    </div>

                </article>

            `;

        }


        // =====================================
        // 6. عرض حالة الطلب باللغة العربية
        // =====================================

        function renderStatus(status) {

            const statuses = {

                pending: {
                    label: 'قيد الانتظار',
                    className: 'pending'
                },

                confirmed: {
                    label: 'تم التأكيد',
                    className: 'confirmed'
                },

                cancelled: {
                    label: 'ملغى',
                    className: 'cancelled'
                }

            };

            const selected =
                statuses[status] || statuses.pending;

            return `
                <span class="badge ${selected.className}">
                    ${selected.label}
                </span>
            `;

        }


        // =====================================
        // 7. إحصائيات الطلبات
        // =====================================

        function renderStatistics() {

            const total = ordersArray.length;

            const pending = ordersArray.filter(
                order => order.status === 'pending'
            ).length;

            const confirmed = ordersArray.filter(
                order => order.status === 'confirmed'
            ).length;

            const cancelled = ordersArray.filter(
                order => order.status === 'cancelled'
            ).length;


            document.getElementById('totalOrders')
                .textContent = total;

            document.getElementById('pendingOrders')
                .textContent = pending;

            document.getElementById('confirmedOrders')
                .textContent = confirmed;

            document.getElementById('cancelledOrders')
                .textContent = cancelled;

        }


        // =====================================
        // 8. تنسيق التاريخ
        // =====================================

        function formatDate(value) {

            if (!value) {
                return 'غير محدد';
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return String(value);
            }

            return new Intl.DateTimeFormat('ar', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            }).format(date);

        }


        // =====================================
        // 9. تحديث حالة طلب عند وصول حدث مباشر
        // =====================================

        function handleOrderStatusChanged(data) {

            if (!data || !data.order_id) {
                return;
            }

            const orderId = Number(data.order_id);

            const order = ordersArray.find(
                item => Number(item.id) === orderId
            );

            if (!order) {

                // الطلب غير موجود في القائمة الحالية.
                // نعيد جلب القائمة للتأكد من أحدث البيانات.
                loadMyOrders();

                return;

            }

            // تحديث الحالة في البيانات المحلية
            order.status = data.to;

            // تحديث شارة الحالة في بطاقة الطلب
            const card = ordersContainer.querySelector(
                `[data-order-id="${orderId}"]`
            );

            if (card) {

                const statusElement = card.querySelector(
                    '[data-order-status]'
                );

                if (statusElement) {

                    statusElement.innerHTML =
                        renderStatus(data.to);

                }

            }

            // تحديث الإحصائيات
            renderStatistics();

            msg(
                notice,
                `تم تحديث حالة الطلب #${orderId} إلى: ${
                    renderStatusText(data.to)
                }`
            );

        }


        function renderStatusText(status) {

            const labels = {
                pending: 'قيد الانتظار',
                confirmed: 'تم التأكيد',
                cancelled: 'ملغى'
            };

            return labels[status] || status;

        }


        // =====================================
        // 10. الاتصال بالتحديثات المباشرة
        // =====================================


        function initializeRealtime() {
            try {
                if (
                    typeof Pusher === 'undefined' ||
                    typeof connectRealtime !== 'function' ||
                    typeof subscribeToCustomerOrders !== 'function'
                ) {
                    setRealtimeStatus(
                        false,
                        'مكتبة التحديثات المباشرة غير محمّلة'
                    );

                    console.error('[Customer] Pusher or realtime functions missing');
                    return;
                }

                const connection = connectRealtime();

                if (!connection) {
                    setRealtimeStatus(
                        false,
                        'تعذر إنشاء اتصال Soketi'
                    );
                    return;
                }

                subscribeToCustomerOrders(
                    ordersArray,
                    handleOrderStatusChanged
                );

                setRealtimeStatus(
                    false,
                    'جاري الاتصال والاشتراك في قنوات طلباتك...'
                );

            } catch (error) {
                console.error('[Customer] Realtime initialization failed:', error);

                setRealtimeStatus(
                    false,
                    'تعذر تهيئة التحديثات المباشرة'
                );
            }
        }

        // =====================================
        // 11. عرض حالة الاتصال
        // =====================================

        function setRealtimeStatus(connected, message) {

            realtimeText.textContent = message;

            realtimeDot.classList.remove(
                'ok',
                'bad'
            );

            realtimeDot.classList.add(
                connected ? 'ok' : 'bad'
            );

        }

    </script>


    <!-- =====================================
         تنسيقات خاصة بالصفحة
    ====================================== -->

    <style>

        .order-card {
            margin-top: 20px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
            flex-wrap: wrap;

            border-bottom: 1px solid var(--line);

            padding-bottom: 15px;
            margin-bottom: 18px;
        }

        .order-header h2 {
            margin-bottom: 5px;
        }

        .order-header p {
            margin-bottom: 0;
            font-size: 13px;
        }

        .order-products h3 {
            font-size: 17px;
            margin-bottom: 12px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            padding: 12px 0;

            border-bottom: 1px solid var(--line);
        }

        .order-item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .order-item-info span {
            font-size: 13px;
            color: var(--muted);
        }

        .order-item-price {
            font-weight: bold;
            white-space: nowrap;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding-top: 18px;
            margin-top: 12px;

            font-size: 17px;
        }

        .order-footer strong {
            color: var(--g);
            font-size: 20px;
        }

        #orderStats .panel {
            margin-bottom: 0;
        }

        #orderStats .panel p {
            margin-bottom: 5px;
            font-size: 14px;
        }

        #orderStats .panel h2 {
            margin-bottom: 0;
            color: var(--g);
        }

        @media (max-width: 600px) {

            .order-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .order-item {
                align-items: flex-start;
            }

            .order-footer {
                font-size: 15px;
            }

        }

    </style>

</body>
</html>
