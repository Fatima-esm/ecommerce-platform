<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="topbar">
        <a class="brand" href="admin.html">ShopApp | Admin</a>
        <nav>
            <a href="products.html">Customer View</a> 
            <button class="btn secondary" onclick="logout()">Logout</button>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Page Header with Socket Status -->
        <div class="section-head">
            <div>
                <h1>Admin Dashboard</h1>
                <p>Manage products and orders</p>
            </div>
            <div class="statusbar" data-socket-state>
                <i class="dot"></i>
                <span data-socket-label>Checking Soketi...</span>
            </div>
        </div>

        <!-- Global Notice Box -->
        <div id="notice" class="notice hidden"></div>

        <!-- Add Product Panel -->
        <section class="panel">
            <h2>Add Product</h2>
            <form id="productForm">
                <div class="row">
                    <div>
                        <label>Product Name</label>
                        <input name="name" required>
                    </div>
                    <div>
                        <label>Price</label>
                        <input name="price" type="number" step="0.01" min="0" required>
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Category</label>
                        <input name="category" required>
                    </div>
                    <div>
                        <label>Initial Stock</label>
                        <input name="stock" type="number" min="0" value="1" required>
                    </div>
                </div>
                <label>Description</label>
                <textarea name="description"></textarea>
                
                <label>Image</label>
                <input name="image" type="file" accept="image/png,image/jpeg">
                
                <button class="btn">Add Product</button>
            </form>
        </section>

        <!-- Orders Management Panel -->
        <section class="panel">
            <div class="section-head">
                <h2>Orders</h2>
                <button class="btn secondary" onclick="loadOrders()">Refresh from API</button>
            </div>
            <p class="small muted">Manual refresh is a fallback; real-time events do not rely on polling.</p>
            
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr><td colspan="5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Scripts and Pusher Library -->
    <script src="../assets/config.js"></script>
    <script src="../assets/api.js"></script>
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    <script src="../assets/realtime.js"></script>
    <!-- Page Controller Script -->
    <script>
        // Check admin authorization on load
        if (requireAdmin()) {
            loadOrders();
            // Bind real-time events for admin (reload orders on new events)
            connectRealtime({
                onCreated: (data) => {
                    console.log('New order received:', data);
                    // إعادة تحميل قائمة الطلبات من API
                    loadOrders();
                },
                onStatus: (data) => {
                    console.log('Order status changed:', data);
                    // تحديث قائمة الطلبات
                    loadOrders();
                }
            });
        }

        // Handle add product form submission
        productForm.onsubmit = async e => {
            e.preventDefault();
            try {
                let d = await api('/api/v1/admin/products', {
                    method: 'POST',
                    body: new FormData(productForm)
                });
                msg(notice, d.message || 'Product added successfully');
                productForm.reset();
            } catch (x) {
                msg(notice, x.message, true);
            }
        };

        // Fetch and display orders in table

async function loadOrders() {
    const tbody = document.getElementById('tbody');

    try {
        const response = await api('/api/v1/admin/orders');
        const orders = extractRows(response);

        if (!orders.length) {
            tbody.innerHTML =
                '<tr><td colspan="5">No orders found</td></tr>';
            return;
        }

        tbody.innerHTML = orders.map(order => `
            <tr>
                <td>#${Number(order.id)}</td>

                <td>
                    ${esc(order.user?.name || ('User ' + order.user_id))}
                </td>

                <td>${money(order.total_amount)}</td>

                <td>${badge(order.status)}</td>

                <td class="actions">
                    ${
                        order.status === 'pending'
                            ? `<button class="btn"
                                onclick="changeStatus(${Number(order.id)}, 'confirmed')">
                                Confirm
                            </button>`
                            : ''
                    }

                    ${
                        order.status !== 'cancelled'
                            ? `<button class="btn danger"
                                onclick="changeStatus(${Number(order.id)}, 'cancelled')">
                                Cancel
                            </button>`
                            : ''
                    }
                </td>
            </tr>
        `).join('');

    } catch (error) {
        tbody.innerHTML = `
            <tr>
                <td colspan="5">${esc(error.message)}</td>
            </tr>
        `;
    }
}

        // Update order status (confirm or cancel)

async function changeStatus(id, status) {
    try {
        await api(`/api/v1/admin/orders/${id}/status`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ status })
        });

        msg(notice, 'تم تحديث الطلب #' + id + ' بنجاح');

        await loadOrders();

    } catch (error) {
        msg(notice, error.message, true);
    }
}    </script>
</body>
</html>
