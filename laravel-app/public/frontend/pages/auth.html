
<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up / Login | ShopApp</title>
    <link rel="stylesheet" href="../assets/style.css">

    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: ltr;
            text-align: left;
        }

        header.topbar {
            position: absolute;
            top: 20px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header.topbar a.brand {
            font-size: 24px;
            font-weight: bold;
            color: #2e5a1e;
            text-decoration: none;
        }

        header.topbar span {
            color: #666;
            font-size: 14px;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* صندوق ثابت الحجم في حالتي تسجيل الدخول وإنشاء الحساب */
        .panel.form {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);

            width: 100%;
            max-width: 450px;
            height: 520px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            box-sizing: border-box;
        }

        .panel.form h1 {
            color: #55823b;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
            margin-top: 0;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .actions .btn.secondary {
            flex: 1;
            background-color: #f0f5ec;
            color: #55823b;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .actions .btn.secondary:hover {
            background-color: #55823b;
            color: #fff;
        }

        .panel.form label {
            display: block;
            margin-bottom: 3px;
            color: #333;
            font-size: 13px;
            font-weight: 500;
        }

        .panel.form input {
            width: 100%;
            padding: 6px 0;
            margin-bottom: 10px;
            border: none;
            border-bottom: 2px solid #ddd;
            outline: none;
            font-size: 14px;
            background: transparent;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .panel.form input:focus {
            border-bottom-color: #55823b;
        }

        /* حاوية كلمة المرور وأيقونة العين */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .panel.form .password-wrapper input {
            padding-right: 35px;
        }

        .toggle-password {
            position: absolute;
            right: 5px;
            top: 0;
            width: 28px;
            height: 30px;
            padding: 0;
            margin: 0;
            border: none;
            background: transparent;
            color: #777;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #55823b;
        }

        .toggle-password svg {
            width: 19px;
            height: 19px;
        }

        .panel.form button.btn:not(.secondary) {
            width: 100%;
            background-color: #6a994e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 5px;
        }

        .panel.form button.btn:not(.secondary):hover {
            background-color: #386641;
        }

        .notice {
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        .notice.error {
            background-color: #ffebee;
            color: #c62828;
        }

        .hidden {
            display: none !important;
        }

        .small {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 0;
        }

        /* تحسين العرض على الشاشات الصغيرة */
        @media (max-width: 500px) {
            header.topbar {
                left: 15px;
                right: 15px;
            }

            .panel.form {
                max-width: calc(100% - 30px);
                padding: 25px;
            }
        }

        @media (max-height: 600px) {
            body {
                align-items: flex-start;
                padding-top: 70px;
                padding-bottom: 20px;
                box-sizing: border-box;
            }

            .panel.form {
                height: 520px;
                flex-shrink: 0;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <a class="brand" href="auth.html">ShopApp</a>
        <span>Welcome to ShopApp</span>
    </header>

    <main class="container">

        <section class="panel form">

            <!-- المحتوى الرئيسي -->
            <div>

                <h1>Sign up</h1>

                <div class="actions">
                    <button class="btn secondary" onclick="tab('register')">
                        New Account
                    </button>

                    <button class="btn secondary" onclick="tab('login')">
                        Login
                    </button>
                </div>

                <div id="notice" class="notice hidden"></div>

                <!-- نموذج تسجيل الدخول -->
                <form id="login" class="hidden">

                    <label>Email</label>
                    <input name="email" type="email" required>

                    <label>Password</label>

                    <div class="password-wrapper">
                        <input
                            id="loginPassword"
                            name="password"
                            type="password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('loginPassword', this)"
                            aria-label="Show password"
                            title="Show password"
                        >
                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <button class="btn" type="submit">
                        Sign In
                    </button>

                </form>

                <!-- نموذج إنشاء حساب -->
                <form id="register">

                    <label>Username</label>
                    <input name="name" required>

                    <label>Email</label>
                    <input name="email" type="email" required>

                    <label>Password</label>

                    <div class="password-wrapper">
                        <input
                            id="registerPassword"
                            name="password"
                            type="password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('registerPassword', this)"
                            aria-label="Show password"
                            title="Show password"
                        >
                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <label class="hidden">Confirm Password</label>
                    <input
                        name="password_confirmation"
                        type="password"
                        minlength="8"
                        class="hidden"
                        value="12345678"
                    >

                    <button class="btn" type="submit">
                        Sign up
                    </button>

                </form>

            </div>

            <!-- النص السفلي ثابت المكان -->
            <p class="small">
                Admin account must already exist in the database with role
                <code>admin</code>.
            </p>

        </section>

    </main>

    <script src="../assets/config.js"></script>
    <script src="../assets/api.js"></script>

    <script>
        const n = document.querySelector('#notice');

        function tab(t) {
            login.classList.toggle('hidden', t !== 'login');
            register.classList.toggle('hidden', t !== 'register');

            document.querySelector('h1').textContent =
                t === 'login' ? 'Login' : 'Sign up';

            // إخفاء رسالة الخطأ عند التبديل
            n.classList.add('hidden');
            n.classList.remove('error');
        }

        // إظهار وإخفاء كلمة المرور
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);

            if (input.type === 'password') {
                input.type = 'text';

                button.setAttribute('aria-label', 'Hide password');
                button.setAttribute('title', 'Hide password');

                button.innerHTML = `
                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M3 3l18 18"/>
                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                        <path d="M9.9 5.2A10.5 10.5 0 0 1 12 5
                            c6.5 0 10 7 10 7a15 15 0 0 1-4 4.7"/>
                        <path d="M6.6 6.6C3.6 8.5 2 12 2 12
                            s3.5 7 10 7a10 10 0 0 0 4-.8"/>
                    </svg>
                `;
            } else {
                input.type = 'password';

                button.setAttribute('aria-label', 'Show password');
                button.setAttribute('title', 'Show password');

                button.innerHTML = `
                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                `;
            }
        }

        // تسجيل الدخول
        login.onsubmit = async e => {
            e.preventDefault();

            try {
                let d = await api('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(
                        Object.fromEntries(new FormData(login))
                    )
                });

                saveSession(d);

                location.href =
                    d.user?.role === 'admin'
                        ? 'admin.html'
                        : 'products.html';

            } catch (x) {
                msg(n, x.message, true);
                n.classList.remove('hidden');
                n.classList.add('error');
            }
        };

        // إنشاء حساب جديد
        register.onsubmit = async e => {
            e.preventDefault();

            try {
                let v = Object.fromEntries(new FormData(register));

                if (!v.password_confirmation) {
                    v.password_confirmation = v.password;
                }

                if (v.password !== v.password_confirmation) {
                    throw Error('Passwords do not match');
                }

                let d = await api('/api/v1/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(v)
                });

                saveSession(d);

                location.href = 'products.html';

            } catch (x) {
                msg(n, x.message, true);
                n.classList.remove('hidden');
                n.classList.add('error');
            }
        };
    </script>

</body>
</html>
